[package]
name = "headercraft"
version = "0.1.1"
edition = "2021"
authors = ["Markus Johansson"]
description = "High-performance file preamble validator, metadata linter, and header formatter in Rust"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/macintorsten/headercraft"
homepage = "https://github.com/macintorsten/headercraft"
keywords = ["header", "linter", "preamble", "pre-commit", "license"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
minijinja = { version = "2.7", features = ["json"] }
regex = "1.11"
ignore = "0.4"
chrono = "0.4"
similar = "3.2"
glob = "0.3"

[dev-dependencies]
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"


